<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive and accessible website with gallery, about, and contact form pages">
  <title>contact Section</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/contact.css">
  <link rel="icon" href="images/crc.jpg" type="image/jpg">
  <script defer src="scripts/contact.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <img src="images/crc.jpg" alt="photography logo" class="logo">
      <ul class="nav-links">
        <li><a href="photography.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><button id="theme-toggle">Toggle Theme</button></li>
      </ul>
    </nav>
  </header>
  <main>
  <section class="contact-section">
    <h2>Contact Me</h2>
    <form action="thankyou.html" method="get" class="contact-form">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>
  
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>
  
      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject">
  
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
  
      <button type="submit">Send Message</button>
    </form>
  </section>
  </main>
  <footer>
    <p>
        &copy; <span id="currentyear"></span> Chioma Nwosu, Nigeria.
    </p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
